site_name: Cracking Code Interviews
site_description: Structured interview preparation for Java backend engineers, Junior through Staff, plus a React/Next.js frontend track.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - admonition
  - pymdownx.details

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

# No explicit nav yet -- MkDocs auto-generates it from the folder structure.
# This is an MVP; curated ordering (driven by each domain's own INDEX.md) is
# a follow-up, not required to get a working, browsable site.
