site_name: Cracking Code Interviews
site_description: Structured interview preparation for Java backend engineers, Junior through Staff, plus a React/Next.js frontend track.
site_author: Juan Melendres
site_url: https://juanmelendres.github.io/cracking-code-interviews/
repo_url: https://github.com/JuanMelendres/cracking-code-interviews
repo_name: JuanMelendres/cracking-code-interviews
# Points at the repo root, not docs/: every mirrored directory (syllabus/,
# cheat-sheets/, study-packs/, etc. -- see scripts/build_docs_site.sh) has
# the identical relative path under docs/ and under the repo root, so an
# edit link built from a mirrored page's docs_dir-relative path resolves
# correctly against the real source file. The only exception is the small
# set of hand-authored docs/ files (index.md, stylesheets/) themselves,
# whose "edit" link will point one directory too shallow -- accepted,
# since those are a handful of files versus hundreds of mirrored ones.
edit_uri: edit/main/
copyright: Copyright &copy; 2026 Juan Melendres — free to read and share, not for resale
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon.png
  icon:
    logo: material/code-braces
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.prune
    - header.autohide
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - awesome-pages

exclude_docs: |
  syllabus/00-overview/changelog.md

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

# Nav ordering/titles are curated per-directory via .pages files (the
# mkdocs-awesome-pages-plugin convention) rather than one giant explicit
# list here -- see study-packs/.pages, syllabus/*/.pages, and the many
# study-pack week-NN/.pages files that hide MANIFEST.md from the sidebar
# (still built, linked from its README, and searchable -- just not
# cluttering the nav tree with two entries per week).
