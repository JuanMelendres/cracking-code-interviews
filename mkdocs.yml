site_name: Cracking Code Interviews
site_description: Structured interview preparation for Java backend engineers, Junior through Staff, plus a React/Next.js frontend track.
site_author: Juan Melendres
site_url: https://juanmelendres.github.io/cracking-code-interviews/
# repo_url/repo_name/edit_uri deliberately removed (2026-09-15, real
# request): the reader wants no link to the source repository anywhere in
# the UI -- removing repo_url also drops Material's header GitHub icon and
# makes page.edit_url unset, which in turn hides the raw-source "view" icon
# overrides/partials/actions.html used to derive from it. See that file's
# own updated comment for how the print button (previously also gated on
# page.edit_url) now renders independently of any repo link.
copyright: Copyright &copy; 2026 Juan Melendres — free to read and share, not for resale
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon.png
  icon:
    logo: material/code-braces
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # navigation.instant (SPA-style page swaps without a full reload) was
    # removed 2026-09-14: reported bug was the footer/prev-next nav and
    # header visually "stuck" overlapping the next page's content after
    # clicking through a chapter -- a known interaction where an instant
    # swap gets caught mid-transition (worse on longer pages, and combined
    # with header.autohide's own scroll-position transform). A full page
    # load is a few hundred ms slower per click but cannot get stuck this
    # way. Revisit only if pinned to a Material version with this fixed.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.prune
    - header.autohide
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - tables
  - toc:
      permalink: true
      # Some chapters (e.g. transactional-proxy-mechanics-and-propagation.md)
      # have 60+ headings down to H3 -- the right-hand TOC becomes an
      # unusable wall of text at full depth. Cap it to H2 for a scannable
      # section-level outline; deeper anchors (permalinks) still work when
      # linked to directly, just aren't listed in the floating TOC.
      toc_depth: 2
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

plugins:
  - search:
      # Default separator (`[\s\-]+`) only splits on whitespace/hyphen, so
      # technical tokens this content is full of -- `@Transactional`,
      # `java.util.concurrent`, `getUser()`, `camelCaseIdentifiers` -- index
      # as one glued token each, unsearchable by their meaningful part alone.
      # This also splits on punctuation and camelCase/PascalCase boundaries.
      separator: '[\s\-,:!=\[\]()"`/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)'
  - awesome-pages
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  # Real request: printable/PDF chapters for interview cramming, not one
  # combined 1,600+-page mega-document. The plugin's only mode is building
  # that single all-pages page (kept out of the nav below), but it also
  # injects @media print CSS site-wide -- that part is what actually serves
  # this use case: File > Print / Save as PDF on any one chapter now hides
  # the sidebar/search/nav chrome and prints just the content cleanly. Must
  # be the last plugin listed (the plugin's own on_config assertion).
  - print-site:
      add_to_navigation: false

exclude_docs: |
  syllabus/00-overview/changelog.md

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  # Makes Mastery Checklist / Completion Criteria checkboxes clickable
  # (pymdownx.tasklist's clickable_checkbox above only removes the HTML
  # `disabled` attribute -- a plain checkbox toggle still forgets its state
  # on the next page load or instant-nav swap without this) and remembers
  # each reader's own checked state in their browser's localStorage.
  - javascripts/checklist-progress.js
  # Click-to-enlarge overlay for Mermaid diagrams -- see diagram-zoom.js.
  - javascripts/diagram-zoom.js

extra_css:
  - stylesheets/extra.css

# Nav ordering/titles are curated per-directory via .pages files (the
# mkdocs-awesome-pages-plugin convention) rather than one giant explicit
# list here -- see study-packs/.pages, syllabus/*/.pages, and the many
# study-pack week-NN/.pages files that hide MANIFEST.md from the sidebar
# (still built, linked from its README, and searchable -- just not
# cluttering the nav tree with two entries per week).
