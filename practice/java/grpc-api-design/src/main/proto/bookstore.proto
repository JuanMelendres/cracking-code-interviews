syntax = "proto3";

package bookstore;

option java_package = "demo.grpc";
option java_multiple_files = true;

// Backs syllabus/07-api-design/grpc-api-design.md (T-918).
// Deliberately exercises all four gRPC call shapes against the same
// service, since that's the axis interviewers probe most.
service BookService {
  // Unary: one request, one response.
  rpc GetBook (BookRequest) returns (Book);

  // Server streaming: one request, many responses over time.
  rpc ListBooks (ListBooksRequest) returns (stream Book);

  // Client streaming: many requests, one response once the client finishes.
  rpc AddBooks (stream Book) returns (AddBooksSummary);

  // Bidirectional streaming: both sides stream independently on one connection.
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

message BookRequest {
  string id = 1;
}

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
}

message ListBooksRequest {
  string author_filter = 1; // empty = all
}

message AddBooksSummary {
  int32 accepted_count = 1;
}

message ChatMessage {
  string sender = 1;
  string text = 2;
}
