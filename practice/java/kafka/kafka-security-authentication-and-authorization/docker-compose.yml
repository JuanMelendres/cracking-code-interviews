services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-security-demo
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Listener named "CLIENT" (not literally "SASL_PLAINTEXT") deliberately --
      # the apache/kafka image's env-var-to-property translation naively
      # converts every underscore to a dot, so a listener literally named
      # SASL_PLAINTEXT would turn "listener.name.sasl_plaintext...." into the
      # WRONG "listener.name.sasl.plaintext...." property name and the JAAS
      # config below would silently never be found. A listener name with no
      # underscore avoids the ambiguity entirely.
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Authentication: SASL/PLAIN, two real users, real passwords.
      # KAFKA_OPTS is only here to satisfy the image's own startup-script
      # sanity check (it string-matches for "java.security.auth.login.config"
      # once it detects a SASL listener). This broker's real JAAS config
      # uses the modern per-listener property below, not a static JAAS
      # file, so a real -Djava.security.auth.login.config=<file> flag
      # would make the JVM try to actually load that (nonexistent) file
      # and fail startup -- this harmless, unrelated dummy property name
      # just needs to contain the same substring to pass the check.
      KAFKA_OPTS: "-Dcomment.java.security.auth.login.config=true"
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_alice="alice-secret";

      # Authorization: KRaft-native ACL authorizer. admin bypasses ACL
      # checks entirely (super user); alice does not -- every permission
      # alice has must be an explicit, real ACL grant below.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # User:ANONYMOUS is the principal this single-node broker's own
      # internal controller-to-controller traffic presents as (the
      # CONTROLLER listener stays PLAINTEXT, unauthenticated, by design --
      # only the client-facing CLIENT/SASL_PLAINTEXT listener requires real
      # authentication). Without this, the broker cannot even register
      # itself with its own controller and fails to start.
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
