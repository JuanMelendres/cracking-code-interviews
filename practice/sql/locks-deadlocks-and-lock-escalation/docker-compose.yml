services:
  db:
    image: postgres:16
    container_name: locks-pg
    environment:
      POSTGRES_PASSWORD: locktest
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
    command: >
      postgres
      -c max_locks_per_transaction=10
      -c max_connections=20
    ports:
      - "55632:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
