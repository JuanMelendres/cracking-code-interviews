name: Deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout defaults to a shallow (depth-1) clone, which
          # only has the latest commit -- git-revision-date-localized then
          # sees the same single commit for every file, so every page would
          # show the last push's date instead of its own real last-modified
          # date. Confirmed by simulating a depth-1 clone locally before
          # this fix: `git log` on a known file returned today's date
          # instead of its real 2026-09-08 commit. Full history needed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs and plugins
        run: pip install -r requirements-docs.txt

      - name: Mirror content into docs/ and fix README links
        run: bash scripts/build_docs_site.sh

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
