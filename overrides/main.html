{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <!-- Google AdSense (Auto Ads) -- site owner's own approved publisher ID,
  added 2026-09-18. Loaded from <head> per Google's own placement guidance;
  Auto Ads decides ad placement automatically, no manual ad-unit markup
  needed in individual pages. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8239126909725676"
     crossorigin="anonymous"></script>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/images/social-card.png">
  <meta property="og:url" content="{{ page.canonical_url or config.site_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ config.site_name }}">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/social-card.png">
{% endblock %}
