title = "cracking-code-interviews gitleaks config"

# Extends gitleaks' own default ruleset rather than replacing it; this file
# only adds a path allowlist for generated/installed artifacts that are
# gitignored and never committed, so they don't produce noise when
# scripts/validate.py runs `gitleaks detect --no-git` (which, unlike a
# normal git-history scan, walks the raw filesystem and does not consult
# .gitignore on its own).
[extend]
useDefault = true

[allowlist]
description = "Generated build output, installed dependencies (never committed), and confirmed false positives from real executed demo output"
paths = [
  '''node_modules''',
  '''\.next''',
  '''\.cache''',
  '''\.venv''',
  '''\.venv-docs''',
  '''graft''',
  '''^site/''',
  '''^docs/(syllabus|study-packs|cheat-sheets|flashcards|architecture-atlas|production-cookbook|practice)/''',
]
regexTarget = "match"
regexes = [
  # gitleaks' generic-api-key rule flags these on entropy alone -- they are
  # synthetic CSRF token values printed by the real executed CSRF/CORS demo
  # (practice/java/week-17/csrf-cors-session/), quoted verbatim in its
  # matching chapter, not real secrets.
  '''csrfToken=[0-9a-f]{32}''',
]
